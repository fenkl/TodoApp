[package]
name = "todo-sync"
version = "0.1.0"
description = "Cross-platform TODO app with synchronization over LAN"
authors = ["Todo Sync Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.70"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "0.15.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "0.15.0", features = ["shell-open", "notification"] }
chrono = "0.4"

[features]
default = [ "wasm"]
wasm = []